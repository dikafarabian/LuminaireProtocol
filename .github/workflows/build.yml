name: "✨ Luminaire Protocol"
run-name: "${{ inputs.run_mode == 'Dry Run' && '🧪' || inputs.run_mode == 'Warm Run' && '🔥' || inputs.run_mode == 'Build' && '🔬' || '🚀' }} ${{ inputs.kernel_version }} | ${{ inputs.lto_mode != 'NONE' && format('{0} LTO x ', inputs.lto_mode) || '' }}${{ contains(inputs.build_system, 'Kleaf') && 'Kleaf' || contains(inputs.build_system, 'AOSP') && 'AOSP' || contains(inputs.build_system, 'Cirrus') && 'Cirrus' || contains(inputs.build_system, 'Neutron') && 'Neutron' || contains(inputs.build_system, 'WeebX') && 'WeebX' || 'Zyc' }} (${{ inputs.run_mode }})"

on:
  workflow_dispatch:
    inputs:
      build_system:
        description: "Build System"
        type: choice
        default: "Make - Neutron"
        options:
          - "Kleaf - AOSP"
          - "Make - AOSP"
          - "Make - Cirrus"
          - "Make - Neutron"
          - "Make - WeebX"
          - "Make - Zyc"
      kernel_version:
        description: "Kernel Version"
        type: choice
        default: "6.1"
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
      kernel_branch_override:
        description: "Kernel Branch"
        type: choice
        default: "luminaire"
        options:
          - "base"
          - "lts"
          - "luminaire"
          - "staging"
      ksu:
        description: "KernelSU"
        type: boolean
        default: true
      kowsu:
        description: "KowSU"
        type: boolean
        default: true
      ksunext:
        description: "KernelSU-Next"
        type: boolean
        default: true
      sukisu:
        description: "SukiSU-Ultra"
        type: boolean
        default: true
      bakasu:
        description: "BakaSU"
        type: boolean
        default: true
      vanilla:
        description: "Vanilla"
        type: boolean
        default: true
      susfs:
        description: "SuSFS"
        type: choice
        default: "enable"
        options:
          - "enable"
          - "disable"
      mountless_engine:
        description: "Mountless Engine"
        type: choice
        default: "none"
        options:
          - "none"
          - "nomount"
      rekernel:
        description: "Re:Kernel"
        type: boolean
        default: true
      droidspaces:
        description: "Droidspaces"
        type: boolean
        default: true
      ntsync:
        description: "NTSync"
        type: boolean
        default: true
      lz4zstd:
        description: "LZ4 1.10.0 + ZSTD 1.5.7"
        type: boolean
        default: true
      lz4kd:
        description: "LZ4KD"
        type: boolean
        default: true
      mglru:
        description: "MGLRU"
        type: boolean
        default: false
      lto_mode:
        description: "LTO"
        type: choice
        default: "THIN"
        options:
          - "NONE"
          - "THIN"
          - "FULL"
      run_mode:
        description: "Run Mode"
        type: choice
        default: "Build"
        options:
          - "Dry Run"
          - "Warm Run"
          - "Build"
          - "Release"
      changelog:
        description: "Changelog on Post"
        type: string
        default: ""
      delivery_target:
        description: "Send Result To"
        type: choice
        default: "Community"
        options:
          - "Community"
          - "Private"
      update_arsenal:
        description: "Update Arsenal"
        type: choice
        default: "no"
        options:
          - "yes"
          - "no"
          - "fresh"
      localversion_override:
        description: "Custom Local Version"
        type: string
        default: "-Luminaire"
      build_identity_override:
        description: "Custom Build Identity (user@host)"
        type: string
        default: "chainonyourdoor@LuminaireCI"

env:
  DEBIAN_FRONTEND: noninteractive
  IS_MAKE: ${{ startsWith(inputs.build_system, 'Make') }}

jobs:

  # ======================================================
  # PREPARE MATRIX + ARSENAL
  # ======================================================
  prepare-matrix:
    name: "Prepare Arsenal"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      addons: ${{ steps.set.outputs.addons }}
      safe_ref: ${{ steps.set.outputs.safe_ref }}
      resolved_kernel_branch: ${{ steps.set.outputs.resolved_kernel_branch }}

      cache_refreshed: ${{ inputs.update_arsenal != 'no' }}

    env:
      PERSONAL_TOKEN:   ${{ secrets.PERSONAL_TOKEN }}
      USE_KERNEL_CACHE: ${{ inputs.update_arsenal == 'no' }}
      USE_AK3_CACHE:    ${{ inputs.update_arsenal == 'no' }}
      USE_CLANG_CACHE:  ${{ inputs.update_arsenal == 'no' }}
      KERNEL_VERSION:   ${{ inputs.kernel_version }}
      KERNEL_BRANCH_OVERRIDE: ${{ inputs.kernel_branch_override }}
      BUILD_SYSTEM:     ${{ inputs.build_system }}
      CCACHE_DIR:       ${{ startsWith(inputs.build_system, 'Make') && format('{0}/.ccache', github.workspace) || '' }}
      CCACHE_MAXSIZE:   ${{ startsWith(inputs.build_system, 'Make') && '900M' || '' }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Build Variant Matrix"
        id: set
        env:
          SUSFS_ENABLED: ${{ inputs.susfs == 'enable' }}
        run: |
          variants=()
          ${{ inputs.ksu }}     && variants+=("{\"kernel_variant\":\"KSU\",\"susfs\":${SUSFS_ENABLED}}")
          ${{ inputs.kowsu }}   && variants+=("{\"kernel_variant\":\"KOWSU\",\"susfs\":${SUSFS_ENABLED}}")
          ${{ inputs.ksunext }} && variants+=("{\"kernel_variant\":\"KSUNEXT\",\"susfs\":${SUSFS_ENABLED}}")
          ${{ inputs.sukisu }}   && variants+=("{\"kernel_variant\":\"SUKISU\",\"susfs\":${SUSFS_ENABLED}}")
          ${{ inputs.bakasu }} && variants+=("{\"kernel_variant\":\"BAKASU\",\"susfs\":${SUSFS_ENABLED}}")
          ${{ inputs.vanilla }}  && variants+=("{\"kernel_variant\":\"VANILLA\",\"susfs\":false}")

          if [ ${#variants[@]} -eq 0 ]; then
            echo "No root solutions selected!"
            exit 1
          fi

          matrix_json=$(printf '%s\n' "${variants[@]}" | jq -cs '{include: .}')
          echo "matrix=${matrix_json}" >> $GITHUB_OUTPUT

          ADDONS="${{ inputs.rekernel && 'rekernel,' || '' }}${{ inputs.droidspaces && 'droidspaces,' || '' }}${{ inputs.ntsync && 'ntsync,' || '' }}${{ inputs.lz4zstd && 'lz4zstd,' || '' }}${{ inputs.lz4kd && 'lz4kd,' || '' }}${{ inputs.mountless_engine != 'none' && format('{0},', inputs.mountless_engine) || '' }}${{ inputs.mglru && 'mglru,' || '' }}"
          echo "addons=${ADDONS}" >> $GITHUB_OUTPUT

          SAFE_REF="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          echo "safe_ref=${SAFE_REF}" >> $GITHUB_OUTPUT

          source functions.sh
          KERNEL_VERSION="${{ inputs.kernel_version }}"
          KERNEL_BRANCH_OVERRIDE="${{ inputs.kernel_branch_override }}"
          RESOLVED_KERNEL_BRANCH="$(resolve_kernel_branch)"
          verify_kernel_branch "$RESOLVED_KERNEL_BRANCH"
          echo "resolved_kernel_branch=${RESOLVED_KERNEL_BRANCH}" >> $GITHUB_OUTPUT

      - name: "Setup Arsenal"
        id: setup-arsenal
        uses: ./.github/actions/setup-arsenal
        with:
          build-system:   ${{ inputs.build_system }}
          kernel-version: ${{ inputs.kernel_version }}
          kernel-branch-override: ${{ inputs.kernel_branch_override }}
          update-arsenal: ${{ inputs.update_arsenal }}
          gh-token:       ${{ secrets.PERSONAL_TOKEN }}

  # ======================================================
  # BUILD VARIANT (parallel)
  # ======================================================
  Start-Build:
    name: "Build Kernel (${{ matrix.kernel_variant }}${{ matrix.susfs && '+SUSFS' || '' }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: prepare-matrix
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false

    env:
      PERSONAL_TOKEN:              ${{ secrets.PERSONAL_TOKEN }}
      USE_KERNEL_CACHE:            "true"
      USE_AK3_CACHE:               "true"
      USE_CLANG_CACHE:             "true"
      CACHE_REFRESHED:             ${{ needs.prepare-matrix.outputs.cache_refreshed }}
      KERNEL_VARIANT:               ${{ matrix.kernel_variant }}
      SUSFS_ENABLED:               ${{ matrix.susfs }}
      KERNEL_VERSION:              ${{ inputs.kernel_version }}
      KERNEL_BRANCH_OVERRIDE:      ${{ inputs.kernel_branch_override }}
      LOCALVERSION_OVERRIDE:      ${{ inputs.localversion_override }}
      BUILD_IDENTITY_OVERRIDE:  ${{ inputs.build_identity_override }}
      LTO_MODE:                  ${{ inputs.lto_mode }}
      RUN_MODE:                    ${{ inputs.run_mode }}
      DRY_RUN:                     ${{ inputs.run_mode == 'Dry Run' }}
      BUILD_SYSTEM:                ${{ inputs.build_system }}
      ADDONS:                      ${{ needs.prepare-matrix.outputs.addons }}
      CCACHE_DIR:                  ${{ startsWith(inputs.build_system, 'Make') && format('{0}/.ccache', github.workspace) || '' }}
      CCACHE_MAXSIZE:              ${{ startsWith(inputs.build_system, 'Make') && '900M' || '' }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Free Disk Space"
        run: |
          sudo mv /usr/share/dotnet        /var/tmp/_trash_dotnet        2>/dev/null || true
          sudo mv /usr/local/lib/android   /var/tmp/_trash_android       2>/dev/null || true
          sudo mv /opt/ghc                 /var/tmp/_trash_ghc           2>/dev/null || true
          sudo mv /usr/lib/jvm             /var/tmp/_trash_jvm           2>/dev/null || true
          sudo mv /usr/share/swift         /var/tmp/_trash_swift         2>/dev/null || true
          sudo mv /usr/local/share/powershell /var/tmp/_trash_pwsh      2>/dev/null || true
          (sudo nice -n 19 ionice -c 3 rm -rf \
            /var/tmp/_trash_dotnet /var/tmp/_trash_android /var/tmp/_trash_ghc \
            /var/tmp/_trash_jvm /var/tmp/_trash_swift /var/tmp/_trash_pwsh \
            /var/lib/docker /var/cache/snapd /home/linuxbrew \
          ) &
          mkdir -p /dev/shm/ldcache
          if [ "${IS_MAKE}" != "true" ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/lib/jvm \
                        /usr/share/swift /usr/local/share/powershell /var/lib/docker \
                        /var/cache/snapd /home/linuxbrew /usr/share/miniconda
          fi
          df -h
          wait

      - name: "Setup Swap Space"
        run: |
          sudo swapoff /mnt/swapfile 2>/dev/null || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: "Tune Swappiness"
        run: sudo sysctl -w vm.swappiness=80

      - name: "Setup Build Environment"
        id: setup-build-env
        uses: ./.github/actions/setup-build-env
        with:
          build-system:   ${{ inputs.build_system }}
          ref-name:       ${{ needs.prepare-matrix.outputs.safe_ref }}
          kernel-branch:  ${{ needs.prepare-matrix.outputs.resolved_kernel_branch }}
          kernel-variant:  ${{ matrix.kernel_variant }}
          susfs:          ${{ matrix.susfs }}
          lto-mode:     ${{ inputs.lto_mode }}
          gh-token:       ${{ secrets.PERSONAL_TOKEN }}

      - name: "Disk Usage"
        run: df -h && du -sh ~/kernel-cache/ 2>/dev/null || true

      - name: "Scout Upstream Refs"
        if: matrix.kernel_variant != 'VANILLA'
        run: bash kernel/ksu/checkpoint/scout.sh

      - name: "Cooking (${{ matrix.kernel_variant }}${{ matrix.susfs && '+SUSFS' || '' }})"
        id: build
        run: bash build.sh

      - name: "Ccache Stats"
        if: always() && env.IS_MAKE == 'true'
        run: ~/ccache-bin/ccache --show-stats

      - name: "Checkpoint (Sync/Promote/Blacklist)"
        if: always() && matrix.kernel_variant != 'VANILLA' && inputs.run_mode != 'Dry Run'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          OUTCOME="${{ steps.build.outcome }}"
          [ "$OUTCOME" = "success" ] && OUTCOME="success" || OUTCOME="failure"
          case "${{ matrix.kernel_variant }}" in
            KSU)
              if [ "${{ matrix.susfs }}" = "true" ]; then
                COMPONENTS="ksu susfs_ksu"
              else
                COMPONENTS="ksu"
              fi
              ;;
            KOWSU)
              if [ "${{ matrix.susfs }}" = "true" ]; then
                COMPONENTS="kowsu susfs_kowsu"
              else
                COMPONENTS="kowsu"
              fi
              ;;
            KSUNEXT)
              if [ "${{ matrix.susfs }}" = "true" ]; then
                COMPONENTS="ksunext_susfs_fork susfs_ksunext"
              else
                COMPONENTS="ksunext"
              fi
              ;;
            SUKISU)
              if [ "${{ matrix.susfs }}" = "true" ]; then
                COMPONENTS="sukisu_builtin susfs_sukisu"
              else
                COMPONENTS="sukisu"
              fi
              ;;
            BAKASU)
              if [ "${{ matrix.susfs }}" = "true" ]; then
                COMPONENTS="bakasu susfs_bakasu"
              else
                COMPONENTS="bakasu"
              fi
              ;;
          esac

          bash kernel/ksu/checkpoint/engine.sh "$OUTCOME" $COMPONENTS

      - name: "Save Build Caches"
        if: always() && env.IS_MAKE == 'true'
        timeout-minutes: 15
        uses: ./.github/actions/save-build-caches
        with:
          build-system:   ${{ inputs.build_system }}
          lto-mode:     ${{ inputs.lto_mode }}
          lto-asset-name: lto-data-${{ needs.prepare-matrix.outputs.resolved_kernel_branch }}-${{ matrix.kernel_variant }}${{ matrix.susfs && '+SUSFS' || '' }}-${{ steps.setup-build-env.outputs.clang-variant-upper }}${{ inputs.lto_mode != 'NONE' && format('-{0}', inputs.lto_mode) || '' }}-${{ needs.prepare-matrix.outputs.safe_ref }}.tar.zst
          ccache-filename: ccache-data-${{ needs.prepare-matrix.outputs.resolved_kernel_branch }}-${{ matrix.kernel_variant }}${{ matrix.susfs && '+SUSFS' || '' }}-${{ steps.setup-build-env.outputs.clang-variant-upper }}${{ inputs.lto_mode != 'NONE' && format('-{0}', inputs.lto_mode) || '' }}-${{ needs.prepare-matrix.outputs.safe_ref }}.tar.zst
          gh-token:       ${{ secrets.PERSONAL_TOKEN }}

      - name: "Upload Zip"
        if: inputs.run_mode == 'Build' || inputs.run_mode == 'Release'
        uses: actions/upload-artifact@v7
        with:
          path: post-stage/*.zip
          archive: false
          retention-days: 1
          if-no-files-found: ignore

  # ======================================================
  # NOTIFY
  # ======================================================
  notify:
    name: "Notify"
    runs-on: ubuntu-24.04
    needs: [prepare-matrix, Start-Build]
    if: (inputs.run_mode == 'Build' || inputs.run_mode == 'Release') && always()

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Download Post Stage"
        uses: actions/download-artifact@v8
        with:
          path: /tmp/post-stage
          merge-multiple: true
          skip-decompress: true

      - name: "Start Local Bot API"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID:    ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:  ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          docker run -d --name tg-bot-api -p 8081:8081 \
            -e TELEGRAM_API_ID="${TELEGRAM_API_ID}" \
            -e TELEGRAM_API_HASH="${TELEGRAM_API_HASH}" \
            -e TELEGRAM_LOCAL=true \
            aiogram/telegram-bot-api:latest
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:8081/bot${TELEGRAM_BOT_TOKEN}/getMe" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs tg-bot-api
          exit 1

      - name: "Send Post"
        env:
          TELEGRAM_API_BASE:         http://localhost:8081
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID:       ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
          DELIVERY_TARGET:           ${{ inputs.delivery_target }}
          ROOT_DIR:                  ${{ github.workspace }}
          STAGE_DIR:                 /tmp/post-stage
          RUN_MODE:                  ${{ inputs.run_mode }}
          KERNEL_VERSION:            ${{ inputs.kernel_version }}
          CHANGELOG:                 ${{ inputs.changelog }}
          EXPECTED_MATRIX_JSON:      ${{ needs.prepare-matrix.outputs.matrix }}
          GITHUB_SERVER_URL:         ${{ github.server_url }}
          GITHUB_REPOSITORY:         ${{ github.repository }}
        run: bash release/telegram/post.sh

      - name: "Stop Local Bot API"
        if: always()
        run: docker rm -f tg-bot-api || true
