name: "Save Build Caches"
description: "Save the LTO cache and ccache to the GitHub Release cache after a build"

inputs:
  build-system:
    required: true
  lto-mode:
    required: true
  lto-asset-name:
    description: "Release asset filename for the LTO cache (only needed when lto-mode is THIN)"
    required: false
  ccache-asset-name:
    description: "Release asset filename for the ccache archive"
    required: true

runs:
  using: composite
  steps:
    - name: "Save LTO Cache"
      if: startsWith(inputs.build-system, 'Make') && inputs.lto-mode == 'THIN'
      uses: ./.github/actions/save-release-cache
      with:
        asset-name: ${{ inputs.lto-asset-name }}
        label:      LTO
        base-dir:   /
        path:       dev/shm/ldcache
        use-sudo:   "true"

    - name: "Save ccache"
      if: always() && startsWith(inputs.build-system, 'Make')
      uses: ./.github/actions/save-release-cache
      with:
        asset-name: ${{ inputs.ccache-asset-name }}
        label:      ccache
        base-dir:   ${{ github.workspace }}
        path:       .ccache
