name: "Restore Release Cache"
description: "Restore a cache archive from the 'cache' GitHub Release (a miss only starts cold)"

inputs:
  asset-name:
    description: "Release asset filename, e.g. ccache-data-android14-6.1-luminaire-KSU-NEUTRON-main.tar.zst"
    required: true
  label:
    description: "Name used in log lines, e.g. ccache"
    required: true
  base-dir:
    description: "Directory the archive is extracted into (tar -C)"
    required: true
  use-sudo:
    description: "Extract with sudo (for paths outside the workspace)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: "Restore ${{ inputs.label }} from Release"
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        ASSET_NAME: ${{ inputs.asset-name }}
        LABEL: ${{ inputs.label }}
        BASE_DIR: ${{ inputs.base-dir }}
        USE_SUDO: ${{ inputs.use-sudo }}
      run: |
        cold_start() {
          echo "${LABEL} cache: $1 — starting cold"
          rm -f "$archive"
          exit 0
        }

        archive="/tmp/${ASSET_NAME}"
        SUDO=""
        [ "$USE_SUDO" = "true" ] && SUDO="sudo"

        gh release view cache --repo "$REPO" > /dev/null 2>&1 || cold_start "cache release not found"

        echo "Checking for ${LABEL} cache asset: ${ASSET_NAME}"
        gh release download cache --repo "$REPO" --pattern "$ASSET_NAME" --dir /tmp/ 2> /dev/null \
          && [ -f "$archive" ] \
          || cold_start "asset not found (${ASSET_NAME})"

        echo "Restoring ${LABEL} cache..."
        $SUDO tar --zstd -xf "$archive" -C "$BASE_DIR" || cold_start "extraction failed"

        rm -f "$archive"
        echo "${LABEL} cache restored"
