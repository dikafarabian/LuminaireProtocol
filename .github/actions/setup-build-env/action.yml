name: "Setup Build Environment"
description: "Clang, arsenal, ccache, and LTO cache restore for Start-Build job"

inputs:
  build-system:
    required: true
  ref-name:
    required: true
  kernel-branch:
    required: true
  kernel-variant:
    required: true
  susfs:
    required: true
  lto-mode:
    required: true

outputs:
  clang-variant:
    description: "Stripped clang variant name (e.g. Cirrus, Neutron)"
    value: ${{ steps.clang-key.outputs.clang_variant }}
  clang-variant-upper:
    description: "Uppercased clang variant (e.g. NEUTRON) — for cache asset filenames only, not cache keys"
    value: ${{ steps.clang-key.outputs.clang_variant_upper }}
  ccache-asset-name:
    description: "Release asset filename for this build's ccache archive"
    value: ${{ steps.asset-names.outputs.ccache_asset_name }}
  lto-asset-name:
    description: "Release asset filename for this build's LTO cache archive"
    value: ${{ steps.asset-names.outputs.lto_asset_name }}

runs:
  using: composite
  steps:
    - name: "Derive Clang Variant"
      id: clang-key
      if: startsWith(inputs.build-system, 'Make')
      shell: bash
      env:
        BUILD_SYSTEM: ${{ inputs.build-system }}
      run: |
        variant="${BUILD_SYSTEM#Make - }"
        echo "clang_variant=${variant}" >> "$GITHUB_OUTPUT"
        echo "clang_variant_upper=${variant^^}" >> "$GITHUB_OUTPUT"

    - name: "Restore Clang Cache"
      if: startsWith(inputs.build-system, 'Make')
      uses: actions/cache/restore@v6
      with:
        path: ~/clang-cache
        key: clang-${{ steps.clang-key.outputs.clang_variant }}

    - name: "Restore Arsenal Cache"
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/ccache-bin
          ~/ak3-cache
          ~/.apt-cache
        key: arsenal

    - name: "Restore Kernel Source Cache"
      uses: actions/cache/restore@v6
      with:
        path: ~/kernel-cache
        key: ${{ startsWith(inputs.build-system, 'Make') && format('kernel-{0}', inputs.kernel-branch) || format('kernel-kleaf-{0}', inputs.kernel-branch) }}

    - name: "Derive Cache Asset Names"
      id: asset-names
      if: startsWith(inputs.build-system, 'Make')
      shell: bash
      env:
        KERNEL_BRANCH: ${{ inputs.kernel-branch }}
        KERNEL_VARIANT: ${{ inputs.kernel-variant }}
        SUSFS: ${{ inputs.susfs }}
        CLANG_UPPER: ${{ steps.clang-key.outputs.clang_variant_upper }}
        LTO_MODE: ${{ inputs.lto-mode }}
        REF_NAME: ${{ inputs.ref-name }}
      run: |
        suffix="${KERNEL_BRANCH}-${KERNEL_VARIANT}"
        [ "$SUSFS" = "true" ] && suffix+="+SUSFS"
        suffix+="-${CLANG_UPPER}"
        [ "$LTO_MODE" != "NONE" ] && suffix+="-${LTO_MODE}"
        suffix+="-${REF_NAME}.tar.zst"
        echo "ccache_asset_name=ccache-data-${suffix}" >> "$GITHUB_OUTPUT"
        echo "lto_asset_name=lto-data-${suffix}" >> "$GITHUB_OUTPUT"

    - name: "Restore ccache"
      if: startsWith(inputs.build-system, 'Make')
      uses: ./.github/actions/restore-release-cache
      with:
        asset-name: ${{ steps.asset-names.outputs.ccache_asset_name }}
        label:      ccache
        base-dir:   ${{ github.workspace }}

    - name: "Restore LTO Cache"
      if: startsWith(inputs.build-system, 'Make') && inputs.lto-mode == 'THIN'
      uses: ./.github/actions/restore-release-cache
      with:
        asset-name: ${{ steps.asset-names.outputs.lto_asset_name }}
        label:      LTO
        base-dir:   /
        use-sudo:   "true"
