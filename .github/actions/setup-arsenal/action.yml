name: "Setup Arsenal"
description: "Restore clang + arsenal cache (auto-saved at end of job if missing) for prepare-matrix job"

inputs:
  build-system:
    required: true
  kernel-version:
    required: true
  kernel-branch-override:
    required: false
    default: ""
  update-arsenal:
    required: true
  gh-token:
    required: true

outputs:
  clang-variant:
    description: "Stripped clang variant name (e.g. Cirrus, Neutron)"
    value: ${{ steps.clang-key.outputs.clang_variant }}

runs:
  using: composite
  steps:
    - name: "Derive Clang Variant"
      id: clang-key
      if: startsWith(inputs.build-system, 'Make')
      shell: bash
      env:
        BUILD_SYSTEM: ${{ inputs.build-system }}
      run: echo "clang_variant=${BUILD_SYSTEM#Make - }" >> "$GITHUB_OUTPUT"

    - name: "Derive Cache Keys"
      id: cache-keys
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        BUILD_SYSTEM: ${{ inputs.build-system }}
        KERNEL_VERSION: ${{ inputs.kernel-version }}
        KERNEL_BRANCH_OVERRIDE: ${{ inputs.kernel-branch-override }}
      run: |
        source functions.sh
        KERNEL_BRANCH="$(resolve_kernel_branch)"
        echo "arsenal_key=arsenal" >> "$GITHUB_OUTPUT"
        if [[ "$BUILD_SYSTEM" == Make* ]]; then
          echo "kernel_key=kernel-${KERNEL_BRANCH}" >> "$GITHUB_OUTPUT"
        else
          echo "kernel_key=kernel-kleaf-${KERNEL_BRANCH}" >> "$GITHUB_OUTPUT"
        fi

    - name: "Force Refresh (delete old caches)"
      if: inputs.update-arsenal != 'no'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        REPO: ${{ github.repository }}
        BUILD_SYSTEM: ${{ inputs.build-system }}
        UPDATE_ARSENAL: ${{ inputs.update-arsenal }}
        ARSENAL_KEY: ${{ steps.cache-keys.outputs.arsenal_key }}
        KERNEL_KEY: ${{ steps.cache-keys.outputs.kernel_key }}
        CLANG_VARIANT: ${{ steps.clang-key.outputs.clang_variant }}
      run: |
        gh cache delete "$ARSENAL_KEY" -R "$REPO" 2>/dev/null || true
        gh cache delete "$KERNEL_KEY" -R "$REPO" 2>/dev/null || true
        if [[ "$BUILD_SYSTEM" == Make* ]]; then
          gh cache delete "clang-${CLANG_VARIANT}" -R "$REPO" 2>/dev/null || true
        fi
        if [ "$UPDATE_ARSENAL" = "fresh" ]; then
          echo "fresh mode — purging ccache + LTO release assets too"
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            gh release delete-asset cache "$asset" -R "$REPO" --yes 2>/dev/null || true
            echo "purged: $asset"
          done < <(gh release view cache -R "$REPO" --json assets -q '.assets[].name' 2>/dev/null | grep -E '^(ccache|lto)-data-' || true)
        fi

    - name: "Cache Clang"
      if: startsWith(inputs.build-system, 'Make')
      uses: actions/cache@v6
      with:
        path: ~/clang-cache
        key: clang-${{ steps.clang-key.outputs.clang_variant }}

    - name: "Cache Arsenal"
      uses: actions/cache@v6
      with:
        path: |
          ~/ccache-bin
          ~/ak3-cache
          ~/.apt-cache
        key: ${{ steps.cache-keys.outputs.arsenal_key }}

    - name: "Cache Kernel Source"
      uses: actions/cache@v6
      with:
        path: ~/kernel-cache
        key: ${{ steps.cache-keys.outputs.kernel_key }}

    - name: "Run Arsenal"
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bash arsenal.sh